name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Install canonical Pi host
        shell: bash
        run: |
          set -euo pipefail
          pi_prefix="${RUNNER_TEMP}/megara-pi"
          npm install --prefix "${pi_prefix}" --no-save --no-package-lock @earendil-works/pi-coding-agent@0.80.10
          pi_bin="${pi_prefix}/node_modules/.bin/pi"
          test -x "${pi_bin}"
          test "$("${pi_bin}" --version)" = "0.80.10"
          echo "PI_BIN=${pi_bin}" >> "${GITHUB_ENV}"
          echo "PI_CODING_AGENT_DIR=${RUNNER_TEMP}/megara-pi-agent" >> "${GITHUB_ENV}"
          echo "PI_OFFLINE=1" >> "${GITHUB_ENV}"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: sh -n install.sh
      - run: bash -n scripts/release-evidence.sh
      - run: cargo run --quiet -- docs check --root docs

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/megara"
          "$bin" --version
          "$bin" targets list --json | grep -q '"name": "codex"'
